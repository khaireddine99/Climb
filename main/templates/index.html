<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main page</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="userName" placeholder="game name..." required>
        <input type="text" name="userTag" placeholder="tag #...." required>
        <button type="submit">Analyze</button>
    </form>
    <div>
        <div class="card">
            <p>{{ bestChamp }}</p>
            <p>{{ bestChampWinrate}}</p>
        </div>
        <div class="card">
            <p>{{ winkda }}</p>
            <p>{{ losekda }}</p>
            <p>{{ kdatips }}</p>
        </div>
        <div class="card">
            {{ jnglObjectives }}
        </div>
        <div class="card">
            {{ winByGameLength }}
            {{ gameLengthTips }}
        </div>
        <div class="card">
            <p>{{ averageWardWins }}</p>
            <p>{{ averageWardLoses }}</p>
            <p>{{ wardingTips }}</p>
        </div>
    </div>
</body>
</html>
